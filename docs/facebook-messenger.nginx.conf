# Example server body: use your existing valid TLS certificate configuration.
# Replace support.example.com and the upstream port for your deployment.
server {
    listen 443 ssl;
    server_name support.example.com;
    ssl_certificate /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;

    # OAuth codes, verification tokens and deletion confirmations must not enter
    # query-string access logs. Apply equivalent redaction to any CDN/APM layer.
    location /v1/facebook/ {
        access_log off;
        # Nginx error messages can also contain the original callback URI.
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        client_max_body_size 10m;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        client_max_body_size 10m;
    }
}
