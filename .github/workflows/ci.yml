name: Incoming API CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: incoming-api-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and verified tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pnpm version
        run: corepack pnpm@10.7.1 --version

      - name: Install dependencies
        run: corepack pnpm@10.7.1 install --frozen-lockfile

      - name: Build API
        run: corepack pnpm@10.7.1 run build

      - name: Test Google Sheets
        run: corepack pnpm@10.7.1 run test:google-sheets

      - name: Test Google People
        run: corepack pnpm@10.7.1 run test:google-people

      - name: Test Shopify security
        run: node --test tests/shopify-security.test.cjs
